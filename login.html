<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Command Center — Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background: #0b0d0e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

    <div style="width: 100%; max-width: 440px; background: #14171a; border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm); padding: 3rem 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
        <div style="font-size: 0.75rem; letter-spacing: 0.2em; color: var(--secondary); text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">AUTHENTICATION GATEWAY</div>
        <h1 style="font-family: var(--font-sans); font-size: 1.4rem; color: #ffffff; margin-bottom: 1.5rem;">ACADEMIC COMMAND CENTER</h1>

        <div style="background: rgba(214,180,91,0.1); border: 1px solid rgba(214,180,91,0.3); padding: 0.75rem 1rem; font-size: 0.75rem; color: #ecd078; margin-bottom: 1.5rem;">
            <strong>DEMO ACCOUNT CREDENTIALS</strong><br>
            Username: <code>admin</code><br>
            Password: <code>ChangeMe123!</code>
        </div>

        <form id="atlas-login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div>
                <label style="font-size: 0.7rem; letter-spacing: 0.15em; color: #73787b; text-transform: uppercase; display: block; margin-bottom: 0.5rem;">USERNAME</label>
                <input type="text" id="login-user" required style="width: 100%; padding: 0.8rem; background: #0f1113; border: 1px solid rgba(255,255,255,0.1); color: #ffffff; border-radius: var(--radius-sm); font-family: var(--font-sans);">
            </div>
            <div>
                <label style="font-size: 0.7rem; letter-spacing: 0.15em; color: #73787b; text-transform: uppercase; display: block; margin-bottom: 0.5rem;">PASSWORD</label>
                <input type="password" id="login-pass" required style="width: 100%; padding: 0.8rem; background: #0f1113; border: 1px solid rgba(255,255,255,0.1); color: #ffffff; border-radius: var(--radius-sm); font-family: var(--font-sans);">
            </div>
            <button type="submit" class="btn-atlas-primary" style="justify-content: center; margin-top: 0.5rem; padding: 10px">AUTHORIZE SESSION &rarr;</button>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <a href="index.html" style="font-size: 0.75rem; color: #73787b; text-decoration: none;">&larr; Return to Public Observatory</a>
        </div>
    </div>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('atlas-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const res = Auth.login(u, p);
            if (res.success) {
                window.location.href = 'admin.html';
            } else {
                alert(res.message);
            }
        });
    </script>
</body>
</html>
